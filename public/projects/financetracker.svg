<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#9333ea"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="300" fill="url(#bg)" rx="16"/>
  <rect width="600" height="300" fill="url(#grid)" rx="16" opacity="0.8"/>

  <circle cx="500" cy="55" r="120" fill="#f9a8d4" opacity="0.10" filter="url(#glow)"/>
  <circle cx="90" cy="245" r="90" fill="#d8b4fe" opacity="0.08" filter="url(#glow)"/>

  <line x1="0" y1="250" x2="600" y2="250" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="60" y1="0" x2="60" y2="300" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <rect x="0" y="0" width="4" height="60" fill="#f9a8d4" rx="2" opacity="0.8"/>
  <rect x="0" y="0" width="60" height="4" fill="#f9a8d4" rx="2" opacity="0.8"/>

  <!-- Bar chart icon -->
  <g transform="translate(240,85)" filter="url(#glow)">
    <rect x="0" y="55" width="20" height="35" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="28" y="35" width="20" height="55" rx="3" fill="#facc15"/>
    <rect x="56" y="15" width="20" height="75" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="84" y="45" width="20" height="45" rx="3" fill="#facc15" opacity="0.85"/>
    <path d="M0 30 L28 15 L56 25 L84 5" stroke="#4ade80" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="84" cy="5" r="4" fill="#4ade80"/>
  </g>

  <text x="300" y="205" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.95">Finance Tracker</text>
  <text x="300" y="232" font-family="Arial, sans-serif" font-size="14" fill="#fce7f3" text-anchor="middle" opacity="0.8">Expenses · Budgets · Real-time Charts</text>
</svg>
