<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="300" fill="url(#bg)" rx="16"/>
  <rect width="600" height="300" fill="url(#grid)" rx="16" opacity="0.8"/>

  <circle cx="500" cy="50" r="120" fill="#7dd3fc" opacity="0.10" filter="url(#glow)"/>
  <circle cx="90" cy="250" r="90" fill="#a5b4fc" opacity="0.08" filter="url(#glow)"/>

  <line x1="0" y1="250" x2="600" y2="250" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="60" y1="0" x2="60" y2="300" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <rect x="0" y="0" width="4" height="60" fill="#7dd3fc" rx="2" opacity="0.8"/>
  <rect x="0" y="0" width="60" height="4" fill="#7dd3fc" rx="2" opacity="0.8"/>

  <!-- Compass / roadmap icon -->
  <g transform="translate(255,90)" filter="url(#glow)">
    <circle cx="45" cy="45" r="42" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.9"/>
    <path d="M45 20 L55 45 L45 70 L35 45 Z" fill="#facc15"/>
    <circle cx="45" cy="45" r="5" fill="#0f172a"/>
    <circle cx="45" cy="45" r="42" fill="none" stroke="#facc15" stroke-width="1.5" opacity="0.4"/>
  </g>

  <text x="300" y="205" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.95">Career Advisor AI</text>
  <text x="300" y="232" font-family="Arial, sans-serif" font-size="14" fill="#e0e7ff" text-anchor="middle" opacity="0.8">Quizzes · Roadmaps · AI Guidance</text>
</svg>
